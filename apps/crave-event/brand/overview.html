<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:#F5F7FB;color:#1D1D1F;width:1400px}
.wrap{padding:48px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{border-radius:20px;padding:40px;display:flex;align-items:center;justify-content:center;min-height:220px;box-sizing:border-box}
.l{background:#fff}.d{background:#0B1530}.b{background:#0A84FF}
h1{margin:48px 48px 0;font-size:30px}.span{grid-column:1/3}
.row{display:flex;gap:28px;align-items:end}.sw{display:flex;gap:16px}.sw div{width:150px;border-radius:14px;padding:70px 14px 12px;font-size:14px;color:#fff;font-weight:600}
</style></head><body><h1>Crave Event: logo kit</h1><div class="wrap">
<div class="card l span"><img src="crave-event-logo/crave-event-horizontal.svg" height="120"></div>
<div class="card d"><img src="crave-event-logo/crave-event-stacked-dark.svg" height="230"></div>
<div class="card l"><img src="crave-event-logo/crave-event-stacked.svg" height="230"></div>
<div class="card b"><img src="crave-event-logo/horizontal/crave-event-horizontal-white.svg" height="80"></div>
<div class="card l"><div class="row"><img src="crave-event-logo/symbol/crave-event-symbol-app-icon.svg" height="120"><img src="crave-event-logo/crave-event-symbol.svg" height="64"><img src="crave-event-logo/crave-event-symbol-small.svg" height="32"><img src="crave-event-logo/crave-event-symbol-small.svg" height="16"><img src="crave-event-logo/symbol/crave-event-symbol-black.svg" height="64"></div></div>
<div class="card l span"><div class="sw"><div style="background:#0A84FF">Crave Blue<br>#0A84FF</div><div style="background:#FF3B30">Live Red<br>#FF3B30</div><div style="background:#1D1D1F">Ink<br>#1D1D1F</div><div style="background:#fff;color:#1D1D1F;outline:1px solid #ddd">White<br>#FFFFFF</div></div></div>
</div></body></html>
